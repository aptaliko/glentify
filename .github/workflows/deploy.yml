name: Deploy

# Production pipeline: migrate the DB, THEN deploy — so new code never goes live against an
# un-migrated database. Chained off the CI workflow via workflow_run so it only runs once
# lint + typecheck + tests have already passed on this commit.
#
#   push to main -> [CI: lint/typecheck/test] --success--> [migrate prod DB] -> [deploy prod]
#
# Vercel's own git auto-deploy for `main` is turned OFF (vercel.json > git.deploymentEnabled),
# so this workflow is the single path to production. Preview deploys for other branches are
# unaffected and still handled by Vercel's git integration.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   PROD_DATABASE_URL  - the production Neon connection string (used only by the migrate step)
#   VERCEL_TOKEN       - a Vercel access token (vercel.com/account/tokens)
#   VERCEL_ORG_ID      - from `.vercel/project.json` after `vercel link` (or the Vercel dashboard)
#   VERCEL_PROJECT_ID  - same source as VERCEL_ORG_ID
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    # workflow_run fires even when CI fails; only proceed on success.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the exact commit CI validated, not just the branch head.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- migrate first; if this fails, the job stops and nothing deploys ---
      - name: Apply DB migrations to production
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npx tsx scripts/migrate.ts

      # --- only reached if migrations succeeded ---
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Deploy WITHOUT --prebuilt on purpose: this uploads the source and lets Vercel build it
      # on Vercel's own infrastructure, where the project's real env vars are injected —
      # including Sensitive ones like DATABASE_URL. `vercel pull` cannot retrieve Sensitive
      # vars, so building in CI (`vercel build` + `--prebuilt`) leaves DATABASE_URL empty and
      # crashes neon() at build time. VERCEL_ORG_ID/VERCEL_PROJECT_ID (job env) identify the project.
      - name: Deploy to production
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
